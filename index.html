<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Control de Temperatura</title>
  <link rel="stylesheet" href="./login.css">
  <link rel="icon" type="image/png" href="./IMG/logo.png">
  <link rel="apple-touch-icon" href="./IMG/logo.png">
  <meta name="theme-color" content="#072B5C">
</head>
<body>
  <div class="contenedor-login">
    <div class="tarjeta-login">
      <div class="cabecera-login">
        <div class="linea-superior"></div>
        <h1>Iniciar sesión</h1>
      </div>

      <form id="loginForm" novalidate>
        <label for="usuario">Usuario</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="Ingrese usuario"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        >

        <div id="estadoValidacion" class="estado-validacion oculto" aria-live="polite">
          <span class="spinner"></span>
          <span id="textoValidacion">Cargando...</span>
        </div>

        <div id="vistaUsuario" class="vista-usuario oculto" aria-live="polite">
          <div class="foto-box">
            <img id="fotoUsuario" src="" alt="Foto del usuario">
          </div>

          <div class="datos-usuario">
            <div id="nombreUsuario" class="nombre-usuario">Usuario detectado</div>
            <div id="rolUsuario" class="rol-usuario"></div>
          </div>
        </div>

        <div id="seccionPassword" class="oculto">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          >
          <button type="submit">Ingresar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="customAlert" class="custom-alert oculto">
    <div class="custom-alert-box">
      <div class="custom-alert-icon">!</div>
      <h3 id="customAlertTitle">Aviso</h3>
      <p id="customAlertMessage">Mensaje</p>
      <button type="button" id="customAlertBtn">Aceptar</button>
    </div>
  </div>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./login.js"></script>
</body>
</html>
